name: jev-observer
version: "0.1.0"
description: "Passive Jev observer: after each completed exchange, scores the assistant reply on 21 observable conversational signals (Jev 1.13 via TypeSafe or DefAPI) and stores probabilities and per-turn deltas locally. Never alters prompts, replies or memory. Sends reply text to api.typesafe.ai or api.defapi.org; needs TYPESAFE_API_KEY or DEFAPI_API_KEY (Settings > Providers)."
author: "Thoth fork"
provides_hooks:
  - post_llm_call
config_schema:
  contextual:
    type: bool
    default: true
    label: "Contextual observer"
    description: "Also judge each exchange in context (understanding, correction uptake, repair, momentum, ...) as jev-context-v1, next to the reply-only baseline."
  context_window:
    type: int
    default: 4
    label: "Context window"
    description: "Previous exchanges included with each contextual judgment (0-12)."
  open_corrections:
    type: int
    default: 3
    label: "Earlier corrections carried"
    description: "User corrections from before the window carried into each judgment (0-6)."
